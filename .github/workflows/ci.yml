name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  target-api-tests:
    name: Target API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: target-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run test:common
      - run: npm run test:vulnerable
      - run: npm run test:fixed

  scanner-tests:
    name: Scanner unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  scanner-vs-lab:
    name: Scanner flags vulnerable, passes fixed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ./scanner

      - name: Scanner must flag the vulnerable API (expect exit 1)
        run: |
          # On any failure, print the API logs before tearing the lab down.
          trap 'rc=$?; [ "$rc" -ne 0 ] && docker compose logs api; docker compose down -v' EXIT
          APP_MODE=vulnerable JWT_SECRET=secret123 docker compose up -d --build --wait --wait-timeout 180
          # Assigned first so a failed login stops the step with its real error.
          TOKENS=$(python scanner/examples/get_tokens.py)
          eval "$TOKENS"
          set +e
          polarizer scan --config scanner/examples/lab.yaml --allow-writes --quiet
          code=$?
          set -e
          echo "scanner exit code: $code (expected 1)"
          test "$code" -eq 1

      - name: Scanner must pass the fixed API (expect exit 0)
        run: |
          trap 'rc=$?; [ "$rc" -ne 0 ] && docker compose logs api; docker compose down -v' EXIT
          SECRET=$(python -c "import secrets; print(secrets.token_hex(48))")
          APP_MODE=fixed JWT_SECRET=$SECRET docker compose up -d --build --wait --wait-timeout 180
          TOKENS=$(python scanner/examples/get_tokens.py)
          eval "$TOKENS"
          polarizer scan --config scanner/examples/lab.yaml --allow-writes --quiet
